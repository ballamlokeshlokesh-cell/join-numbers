<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Traversal Pro - 100 Levels</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-primary: #66fcf1;
            --text-secondary: #c5c6c7;
            --cell-bg: #0b0c10;
            --cell-border: #45f3ff33;
            --active-teal: #66fcf1;
            --active-bg: rgba(102, 252, 241, 0.15);
            --error-red: #ff4a4a;
            --warning-orange: #ffb347;
            --grid-size: 4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
            user-select: none;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 420px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #45f3ff1a;
            text-align: center;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }

        .controls-panel {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .select-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: bold;
            text-transform: uppercase;
        }

        select, input[type="number"] {
            background: var(--bg-color);
            border: 1px solid var(--cell-border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        .level-slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--text-primary);
        }

        .mini-btn {
            flex: none;
            padding: 8px 10px;
            min-width: 60px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
        }

        .timer-box, .best-time-box {
            background: rgba(102, 252, 241, 0.08);
            border: 1px solid var(--cell-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-weight: bold;
            font-size: 14px;
            padding: 8px 10px;
            text-align: center;
            flex: 1;
        }

        .timer-box.warning {
            color: var(--warning-orange);
            border-color: rgba(255, 179, 71, 0.6);
            background: rgba(255, 179, 71, 0.08);
        }

        .timer-box.danger {
            color: var(--error-red);
            border-color: rgba(255, 74, 74, 0.6);
            background: rgba(255, 74, 74, 0.08);
        }

        .leaderboard-box {
            margin-top: 12px;
            background: rgba(0,0,0,0.18);
            border: 1px solid var(--cell-border);
            border-radius: 8px;
            padding: 10px;
            text-align: left;
        }

        .leaderboard-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), minmax(0, 1fr));
            grid-gap: 8px;
            position: relative;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px;
            border-radius: 10px;
        }

        .cell {
            background-color: var(--cell-bg);
            border: 2px solid var(--cell-border);
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .cell.hidden-val .number-text {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cell.completed {
            border-color: var(--active-teal);
            color: var(--active-teal);
            background-color: var(--active-bg);
        }

        .cell.completed .number-text {
            opacity: 1 !important;
        }

        .cell.current-head::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: var(--active-teal);
            border-radius: 50%;
            position: absolute;
        }

        .cell.current-head .number-text {
            display: none;
        }

        .cell.error {
            animation: shake 0.2s ease-in-out;
            border-color: var(--error-red);
            color: var(--error-red);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .status-box {
            font-size: 14px;
            color: var(--text-primary);
            min-height: 24px;
            font-weight: 600;
            margin-top: 10px;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            background-color: #45f3ff22;
            border: 1px solid var(--text-primary);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--text-primary);
            color: var(--bg-color);
        }

        .svg-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .path-line {
            stroke: var(--active-teal);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-row">
            <div class="title">Matrix Traversal</div>
            <div id="level-badge" style="font-weight: bold; color: var(--text-primary);">Lvl 1</div>
        </div>

        <div class="controls-panel">
            <div class="select-group">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty" onchange="changeSettings()">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard (Hidden Mode)</option>
                </select>
            </div>

            <div class="select-group">
                <label for="time-limit-input">Time Limit:</label>
                <div class="level-slider-container" style="width: auto;">
                    <input type="number" id="time-limit-input" min="5" max="300" step="5" value="30" style="width: 76px;">
                    <button class="btn mini-btn" type="button" onclick="applyCustomTime()">Set</button>
                </div>
            </div>

            <div class="select-group">
                <label>Jump to Level:</label>
                <div class="level-slider-container">
                    <input type="range" id="level-slider" min="1" max="100" value="1" oninput="syncLevelFromSlider(this.value)">
                    <input type="number" id="level-input" min="1" max="100" value="1" style="width: 50px;" onchange="syncLevelFromInput(this.value)">
                </div>
            </div>
        </div>

        <div class="info-row">
            <div class="timer-box" id="timer-box">Time: 00:30</div>
            <div class="best-time-box" id="best-time-box">Best: --</div>
        </div>

        <div class="leaderboard-box" id="leaderboard-box"></div>

        <div class="grid-container" id="grid-container">
            <svg class="svg-overlay" id="svg-overlay"></svg>
        </div>

        <div class="status-box" id="status-message">Click 1 to start the spiral path!</div>

        <div class="action-row">
            <button class="btn" onclick="restartLevel()">Restart</button>
            <button class="btn" id="next-btn" onclick="nextLevel()" style="display:none;">Next Level</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'matrix-traversal-best-times';
        const LEADERBOARD_KEY = 'matrix-traversal-leaderboard';

        let currentLevel = 1;
        let difficulty = 'medium';
        let nextExpectedValue = 1;
        let maxNodes = 16;
        let trackedPath = [];
        let gridMatrix = [];
        let pathLocked = false;
        let baseTimeLimit = 30;
        let timeLimit = 30;
        let timeRemaining = 30;
        let timerInterval = null;
        let gameActive = true;
        let bestTimes = {};
        let leaderboard = [];
        let audioContext = null;

        function getDifficultyMultiplier() {
            if (difficulty === 'easy') return 1.3;
            if (difficulty === 'hard') return 0.7;
            return 1;
        }

        function getEffectiveTimeLimit() {
            return Math.max(5, Math.round(baseTimeLimit * getDifficultyMultiplier()));
        }

        function loadBestTimes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    bestTimes = JSON.parse(saved);
                }
            } catch (error) {
                bestTimes = {};
            }
        }

        function saveBestTimes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(bestTimes));
            } catch (error) {
                // ignore storage issues
            }
        }

        function loadLeaderboard() {
            try {
                const saved = localStorage.getItem(LEADERBOARD_KEY);
                if (saved) {
                    leaderboard = JSON.parse(saved);
                }
            } catch (error) {
                leaderboard = [];
            }
        }

        function saveLeaderboard() {
            try {
                localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
            } catch (error) {
                // ignore storage issues
            }
        }

        function formatTime(totalSeconds) {
            const safeSeconds = Math.max(0, totalSeconds);
            const minutes = Math.floor(safeSeconds / 60);
            const seconds = safeSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function getBestTimeForCurrentLevel() {
            const currentBest = bestTimes[currentLevel];
            return currentBest == null ? null : Number(currentBest);
        }

        function updateBestTimeDisplay() {
            const bestTimeBox = document.getElementById('best-time-box');
            if (!bestTimeBox) return;

            const best = getBestTimeForCurrentLevel();
            bestTimeBox.textContent = best == null ? 'Best: --' : `Best: ${formatTime(best)}`;
        }

        function updateTimerDisplay() {
            const timerBox = document.getElementById('timer-box');
            if (!timerBox) return;

            timerBox.textContent = `Time: ${formatTime(timeRemaining)}`;
            timerBox.classList.remove('warning', 'danger');

            if (timeRemaining <= 10 && timeRemaining > 0) {
                timerBox.classList.add('warning');
            } else if (timeRemaining === 0) {
                timerBox.classList.add('danger');
            }
        }

        function renderLeaderboard() {
            const leaderboardBox = document.getElementById('leaderboard-box');
            if (!leaderboardBox) return;

            if (!leaderboard.length) {
                leaderboardBox.innerHTML = '<div class="leaderboard-title">Leaderboard</div><div style="color: var(--text-secondary); font-size: 13px;">No runs yet</div>';
                return;
            }

            const entries = leaderboard.slice(0, 5);
            const html = [
                '<div class="leaderboard-title">Leaderboard</div>',
                ...entries.map((entry, index) => {
                    return `
                        <div class="leaderboard-item">
                            <span>${index + 1}. L${entry.level} ${entry.difficulty}</span>
                            <span>${formatTime(entry.seconds)}</span>
                        </div>
                    `;
                })
            ].join('');

            leaderboardBox.innerHTML = html;
        }

        function getAudioContext() {
            if (!audioContext) {
                const AudioCtor = window.AudioContext || window.webkitAudioContext;
                if (AudioCtor) {
                    audioContext = new AudioCtor();
                }
            }
            return audioContext;
        }

        function playTone(frequency, duration, volume = 0.05, type = 'sine') {
            const context = getAudioContext();
            if (!context) return;

            const oscillator = context.createOscillator();
            const gainNode = context.createGain();

            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;

            oscillator.connect(gainNode);
            gainNode.connect(context.destination);
            oscillator.start();

            setTimeout(() => {
                try {
                    oscillator.stop();
                } catch (error) {
                    // ignore if already stopped
                }
            }, duration * 1000);
        }

        function playLevelStartTone() {
            playTone(620, 0.08, 0.04, 'triangle');
            setTimeout(() => playTone(820, 0.08, 0.04, 'triangle'), 120);
        }

        function playWarningTone() {
            playTone(440, 0.12, 0.05, 'sawtooth');
        }

        function playFinishTone() {
            playTone(700, 0.12, 0.05, 'triangle');
            setTimeout(() => playTone(980, 0.15, 0.05, 'triangle'), 140);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;

                timeRemaining -= 1;
                updateTimerDisplay();

                if (timeRemaining <= 10 && timeRemaining > 0) {
                    playWarningTone();
                }

                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    updateTimerDisplay();
                    playWarningTone();
                    endGame('Time is up! Try again.');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function endGame(message) {
            gameActive = false;
            pathLocked = true;
            stopTimer();

            const status = document.getElementById('status-message');
            if (status) status.textContent = message;

            const nextButton = document.getElementById('next-btn');
            if (nextButton) nextButton.style.display = 'block';
        }

        function addLeaderboardEntry() {
            const entry = {
                level: Number(currentLevel),
                difficulty: difficulty,
                seconds: Math.max(1, timeLimit - timeRemaining)
            };

            leaderboard.push(entry);
            leaderboard.sort((a, b) => a.seconds - b.seconds);
            leaderboard = leaderboard.slice(0, 5);
            saveLeaderboard();
            renderLeaderboard();
        }

        function applyCustomTime() {
            const input = document.getElementById('time-limit-input');
            const parsedValue = parseInt(input.value, 10);
            const safeValue = Number.isFinite(parsedValue) ? parsedValue : 30;
            baseTimeLimit = Math.max(5, Math.min(300, safeValue));
            input.value = baseTimeLimit;
            timeLimit = getEffectiveTimeLimit();
            timeRemaining = timeLimit;
            updateTimerDisplay();
            buildLevel();
        }

        function changeSettings() {
            difficulty = document.getElementById('difficulty').value;
            timeLimit = getEffectiveTimeLimit();
            timeRemaining = timeLimit;
            buildLevel();
        }

        function syncLevelFromSlider(val) {
            currentLevel = Math.max(1, Math.min(100, parseInt(val) || 1));
            document.getElementById('level-input').value = currentLevel;
            buildLevel();
        }

        function syncLevelFromInput(val) {
            const num = Math.max(1, Math.min(100, parseInt(val) || 1));
            currentLevel = num;
            document.getElementById('level-slider').value = num;
            buildLevel();
        }

        function rotateMatrix(matrix) {
            if (!matrix.length || !matrix[0].length) return matrix;
            return matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
        }

        function flipMatrixHorizontal(matrix) {
            return matrix.map(row => [...row].reverse());
        }

        function generateSpiralData(size, level) {
            const matrix = Array.from({ length: size }, () => Array(size).fill(0));
            let value = 1;
            let top = 0;
            let bottom = size - 1;
            let left = 0;
            let right = size - 1;

            while (top <= bottom && left <= right) {
                for (let i = left; i <= right; i++) matrix[top][i] = value++;
                top += 1;

                for (let i = top; i <= bottom; i++) matrix[i][right] = value++;
                right -= 1;

                if (top <= bottom) {
                    for (let i = right; i >= left; i--) matrix[bottom][i] = value++;
                    bottom -= 1;
                }

                if (left <= right) {
                    for (let i = bottom; i >= top; i--) matrix[i][left] = value++;
                    left += 1;
                }
            }

            let transformed = matrix;
            const mod = level % 4;
            if (mod === 1) transformed = rotateMatrix(transformed);
            if (mod === 2) transformed = flipMatrixHorizontal(transformed);
            if (mod === 3) transformed = rotateMatrix(flipMatrixHorizontal(transformed));

            return transformed;
        }

        function getGridSize(level) {
            if (difficulty === 'easy') return Math.min(4, 3 + Math.floor((level - 1) / 22));
            if (difficulty === 'hard') return Math.min(6, 4 + Math.floor((level - 1) / 15));
            return Math.min(5, 4 + Math.floor((level - 1) / 18));
        }

        function getCellCenter(row, col, size) {
            const cellSize = 100 / size;
            const x = (col + 0.5) * cellSize;
            const y = (row + 0.5) * cellSize;
            return { x, y };
        }

        function drawPathOverlay() {
            const svg = document.getElementById('svg-overlay');
            const grid = document.getElementById('grid-container');
            if (!svg || !grid) return;

            svg.innerHTML = '';
            if (!trackedPath.length) return;

            const size = gridMatrix.length || 4;

            let d = '';
            trackedPath.forEach((pos, index) => {
                const { x, y } = getCellCenter(pos.r, pos.c, size);
                const px = ((x / 100) * grid.clientWidth);
                const py = ((y / 100) * grid.clientHeight);

                if (index === 0) {
                    d += `M ${px} ${py}`;
                } else {
                    d += ` L ${px} ${py}`;
                }
            });

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            line.setAttribute('d', d);
            line.setAttribute('class', 'path-line');
            svg.appendChild(line);
        }

        function buildLevel() {
            const gridContainer = document.getElementById('grid-container');
            const svgOverlay = document.getElementById('svg-overlay');
            const statusMessage = document.getElementById('status-message');
            const levelBadge = document.getElementById('level-badge');
            const nextButton = document.getElementById('next-btn');
            const difficultySelector = document.getElementById('difficulty');

            if (difficultySelector) difficultySelector.value = difficulty;
            if (levelBadge) levelBadge.textContent = `Lvl ${currentLevel}`;
            if (nextButton) nextButton.style.display = 'none';
            if (statusMessage) statusMessage.textContent = `Click ${nextExpectedValue} to start the spiral path!`;

            timeLimit = getEffectiveTimeLimit();
            timeRemaining = timeLimit;
            const size = getGridSize(currentLevel);
            document.documentElement.style.setProperty('--grid-size', size);

            const matrix = generateSpiralData(size, currentLevel);
            gridMatrix = matrix;
            trackedPath = [];
            nextExpectedValue = 1;
            pathLocked = false;
            gameActive = true;
            updateTimerDisplay();
            updateBestTimeDisplay();
            startTimer();
            playLevelStartTone();

            const cells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const value = matrix[r][c];
                    const cell = document.createElement('button');
                    cell.type = 'button';
                    cell.className = 'cell';
                    if (difficulty === 'hard') cell.classList.add('hidden-val');
                    cell.dataset.value = value;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.setAttribute('aria-label', `Cell ${value}`);
                    cell.innerHTML = `<span class="number-text">${value}</span>`;
                    cell.onclick = () => handleCellClick(cell, value);
                    cells.push(cell);
                }
            }

            if (gridContainer) {
                gridContainer.innerHTML = '';
                cells.forEach(cell => gridContainer.appendChild(cell));
            }

            if (svgOverlay) {
                svgOverlay.innerHTML = '';
            }

            maxNodes = size * size;
            if (currentLevel > 100) currentLevel = 100;
            if (document.getElementById('level-slider')) document.getElementById('level-slider').value = currentLevel;
            if (document.getElementById('level-input')) document.getElementById('level-input').value = currentLevel;
        }

        function handleCellClick(cell, value) {
            if (pathLocked || !gameActive) return;

            if (Number(value) === nextExpectedValue) {
                trackedPath.push({ r: Number(cell.dataset.row), c: Number(cell.dataset.col) });
                cell.classList.add('completed');
                cell.classList.remove('error');
                nextExpectedValue += 1;

                if (nextExpectedValue <= maxNodes) {
                    const status = document.getElementById('status-message');
                    if (status) status.textContent = `Great! Next target: ${nextExpectedValue}`;
                }

                drawPathOverlay();

                if (nextExpectedValue > maxNodes) {
                    const elapsedSeconds = Math.max(1, timeLimit - timeRemaining);
                    const previousBest = getBestTimeForCurrentLevel();
                    if (previousBest == null || elapsedSeconds < previousBest) {
                        bestTimes[currentLevel] = elapsedSeconds;
                        saveBestTimes();
                    }
                    updateBestTimeDisplay();
                    addLeaderboardEntry();
                    playFinishTone();

                    gameActive = false;
                    pathLocked = true;
                    stopTimer();
                    const status = document.getElementById('status-message');
                    if (status) status.textContent = 'Level cleared! Excellent spiral run.';
                    const nextButton = document.getElementById('next-btn');
                    if (nextButton) nextButton.style.display = 'block';
                }
                return;
            }

            if (Number(value) < nextExpectedValue) {
                const status = document.getElementById('status-message');
                if (status) status.textContent = 'Already completed. Pick the next number.';
                return;
            }

            cell.classList.add('error');
            setTimeout(() => cell.classList.remove('error'), 220);
            const status = document.getElementById('status-message');
            if (status) status.textContent = `Wrong move! Expected ${nextExpectedValue}.`;
        }

        function restartLevel() {
            buildLevel();
        }

        function nextLevel() {
            currentLevel = Math.min(100, currentLevel + 1);
            document.getElementById('level-slider').value = currentLevel;
            document.getElementById('level-input').value = currentLevel;
            buildLevel();
        }

        window.addEventListener('load', () => {
            loadBestTimes();
            loadLeaderboard();
            renderLeaderboard();
            document.getElementById('difficulty').value = difficulty;
            document.getElementById('time-limit-input').value = baseTimeLimit;
            updateTimerDisplay();
            updateBestTimeDisplay();
            buildLevel();
        });
    </script>
</body>
</html>
